services:
  # -------------------------------------------------------------
  # BANCO DE DADOS ÚNICO DO MONÓLITO (PostgreSQL)
  # -------------------------------------------------------------
  monolith-postgres-db:
    image: postgres:16-alpine
    container_name: tcc-mono-postgres-db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: monolith_db
      POSTGRES_USER: tcc_user
      POSTGRES_PASSWORD: tcc_password
    volumes:
      - monolith-postgres-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
    networks:
      - monolith-net

  # -------------------------------------------------------------
  # MONÓLITO 1: E-COMMERCE VAREJISTA (Porta 8001)
  # -------------------------------------------------------------
  ecommerce-monolith:
    build:
      context: ../src/apps/ecommerce
      dockerfile: Dockerfile
    container_name: tcc-mono-ecommerce
    restart: always
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      POSTGRES_URI: postgresql://tcc_user:tcc_password@monolith-postgres-db:5432/monolith_db
    depends_on:
      - monolith-postgres-db
    networks:
      - monolith-net

  # -------------------------------------------------------------
  # MONÓLITO 2: MES MANUFATURA (Porta 8002)
  # -------------------------------------------------------------
  mes-monolith:
    build:
      context: ../src/apps/mes
      dockerfile: Dockerfile
    container_name: tcc-mono-mes
    restart: always
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      POSTGRES_URI: postgresql://tcc_user:tcc_password@monolith-postgres-db:5432/monolith_db
    depends_on:
      - monolith-postgres-db
    networks:
      - monolith-net

  # -------------------------------------------------------------
  # MONÓLITO 3: MONITOR DE LEILÕES (Porta 8003)
  # -------------------------------------------------------------
  auction-monolith:
    build:
      context: ../src/apps/auction
      dockerfile: Dockerfile
    container_name: tcc-mono-auction
    restart: always
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      POSTGRES_URI: postgresql://tcc_user:tcc_password@monolith-postgres-db:5432/monolith_db
    depends_on:
      - monolith-postgres-db
    networks:
      - monolith-net

  # -------------------------------------------------------------
  # FRONTEND UNIFICADO (Next.js App)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ../src/frontend
      dockerfile: Dockerfile
    container_name: tcc-mono-frontend
    restart: always
    ports:
      - "4000:4000"
    environment:
      NEXT_PUBLIC_ECOMMERCE_URL: http://localhost:8001
      NEXT_PUBLIC_MES_URL: http://localhost:8002
      NEXT_PUBLIC_AUCTION_URL: http://localhost:8003
    depends_on:
      - ecommerce-monolith
      - mes-monolith
      - auction-monolith
    networks:
      - monolith-net

networks:
  monolith-net:
    driver: bridge

volumes:
  monolith-postgres-data:

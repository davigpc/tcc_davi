# Compose do experimento: inventory-api / Transacoes / snapshot-2
# Topologia: monolito (apenas reports) + Estoque + Identidade + PostgreSQL
# compartilhado + gateway NGINX (Strangler Fig).
name: inventory-api-transacoes-s2

services:
  db:
    image: postgres:15-alpine
    container_name: inventory_transacoes_s2_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  monolith:
    build:
      context: ../../apps/inventory-api
      dockerfile: Dockerfile
      target: production
    container_name: inventory_transacoes_s2_monolith
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  estoque:
    build:
      context: ../../services/inventory-api/estoque
      dockerfile: Dockerfile
    container_name: inventory_transacoes_s2_estoque
    restart: unless-stopped
    command: ["node", "dist/main"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      IDENTITY_URL: http://identity:3000
      PORT: 3000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  identity:
    build:
      context: ../../services/inventory-api/identity
      dockerfile: Dockerfile
    container_name: inventory_transacoes_s2_identity
    restart: unless-stopped
    command: ["node", "dist/main"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ESTOQUE_URL: http://estoque:3000
      PORT: 3000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: inventory_transacoes_s2_nginx
    restart: unless-stopped
    volumes:
      - ../gateway/nginx-transacoes-s2.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - monolith
      - estoque
      - identity

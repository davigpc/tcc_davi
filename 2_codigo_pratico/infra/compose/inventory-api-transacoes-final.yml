# Compose do experimento: inventory-api / Transacoes / snapshot-final
# Decomposicao concluida: o grupo atomico de estoque foi extraido primeiro (s1),
# a identidade no s2 e o monolito (reports) deixa de existir no estado final.
# Topologia: Identidade + Estoque + Relatorios + 2 PostgreSQL + gateway NGINX.
# Persistencia isolada (banco por servico) e comunicacao interservicos via HTTP.
name: inventory-api-transacoes-final

services:
  identity_db:
    image: postgres:15-alpine
    container_name: inventory_transacoes_final_identity_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: inventory_identity
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d inventory_identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  estoque_db:
    image: postgres:15-alpine
    container_name: inventory_transacoes_final_estoque_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: inventory_estoque
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d inventory_estoque"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    build:
      context: ../../services/inventory-api/identity
      dockerfile: Dockerfile
    container_name: inventory_transacoes_final_identity
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@identity_db:5432/inventory_identity
      ESTOQUE_URL: http://estoque:3000
      PORT: 3000
      NODE_ENV: production
    depends_on:
      identity_db:
        condition: service_healthy

  estoque:
    build:
      context: ../../services/inventory-api/estoque
      dockerfile: Dockerfile
    container_name: inventory_transacoes_final_estoque
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@estoque_db:5432/inventory_estoque
      IDENTITY_URL: http://identity:3000
      PORT: 3000
      NODE_ENV: production
    depends_on:
      estoque_db:
        condition: service_healthy

  reports:
    build:
      context: ../../services/inventory-api/reports
      dockerfile: Dockerfile
    container_name: inventory_transacoes_final_reports
    restart: unless-stopped
    environment:
      ESTOQUE_URL: http://estoque:3000
      PORT: 3000
      NODE_ENV: production
    depends_on:
      - estoque

  nginx:
    image: nginx:alpine
    container_name: inventory_transacoes_final_nginx
    restart: unless-stopped
    volumes:
      - ../gateway/nginx-transacoes-final.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - identity
      - estoque
      - reports

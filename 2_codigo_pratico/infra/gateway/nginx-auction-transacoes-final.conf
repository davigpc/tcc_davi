# Gateway NGINX — Strangler Fig (leilao / Transacoes / snapshot final)
# Identidade em /auth, Tempo Real em /socket.io, grupo atomico no restante.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream identidade_up {
    server identidade:3001;
  }

  upstream atomo_up {
    server atomo:3001;
  }

  upstream realtime_up {
    server tempo-real:3001;
  }

  server {
    listen 80;

    location /socket.io/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://realtime_up;
    }

    location /auth {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://identidade_up;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://atomo_up;
    }
  }
}

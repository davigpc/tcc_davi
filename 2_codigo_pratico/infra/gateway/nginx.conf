# Gateway NGINX — Strangler Fig
# Roteia por prefixo de caminho: /api/reports/* -> serviço de Relatórios;
# todo o restante -> monólito. O cliente segue batendo no mesmo host.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream monolith_up {
    server monolith:3000;
  }

  upstream reports_up {
    server reports:3000;
  }

  server {
    listen 80;

    # Rota extraída: desviada para o novo serviço
    location /api/reports/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://reports_up;
    }

    # Todo o restante continua no monólito
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://monolith_up;
    }
  }
}

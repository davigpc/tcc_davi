# Gateway NGINX — Strangler Fig (inventory-api / Subdomínio (DDD) / snapshot-1)
# Roteia por prefixo de caminho:
#   /api/auth/*, /api/users/*  -> serviço de Identidade (contexto genérico)
#   /api/reports/*             -> serviço de Relatórios (contexto genérico)
#   todo o restante            -> monólito (warehouses, products, movements)

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream monolith_up {
    server monolith:3000;
  }

  upstream reports_up {
    server reports:3000;
  }

  upstream identity_up {
    server identity:3000;
  }

  server {
    listen 80;

    location /api/auth {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://identity_up;
    }

    location /api/users {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://identity_up;
    }

    location /api/reports {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://reports_up;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://monolith_up;
    }
  }
}

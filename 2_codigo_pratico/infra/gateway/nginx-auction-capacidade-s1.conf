# Gateway NGINX — Strangler Fig (leilao / Capacidade de Negocio / s1)
# O servico de Lances responde por /auctions/:id/bids; o restante continua no
# monolito. O cliente segue batendo em http://localhost:3000.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream api_up {
    server api:3100;
  }

  upstream lances_up {
    server lances:3001;
  }

  server {
    listen 80;

    # Lances: POST e GET em /auctions/:auctionId/bids
    location ~ ^/auctions/[0-9a-fA-F-]+/bids(/.*)?$ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://lances_up;
    }

    # Todo o restante (inclui o Socket.IO) fica no monolito
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://api_up;
    }
  }
}

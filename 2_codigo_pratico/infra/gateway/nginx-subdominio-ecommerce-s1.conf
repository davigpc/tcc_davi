# Gateway NGINX — Strangler Fig (ecommerce / Subdomínio DDD / s1)
# Identidade responde por /api/auth, /api/users, /api/profile e /api/address;
# Comunicação por /api/emails. O restante (catálogo, carrinho, pedido, cobrança
# e webhook) continua no monólito. O cliente segue batendo em
# http://localhost:3001.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream monolith_up {
    server monolith:3002;
  }

  upstream identidade_up {
    server identidade:3001;
  }

  upstream comunicacao_up {
    server comunicacao:3001;
  }

  server {
    listen 80;

    client_max_body_size 20m;

    location /api/internal {
      return 404;
    }

    location /api/auth {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://identidade_up;
    }

    location /api/users {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://identidade_up;
    }

    location /api/profile {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://identidade_up;
    }

    location /api/address {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://identidade_up;
    }

    location /api/emails {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://comunicacao_up;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://monolith_up;
    }
  }
}

# Gateway NGINX — Strangler Fig (leilao / Transacoes / s2)
# Identidade em /auth, tempo real no monolito restante, leiloes/lances/cartas no
# servico atomico.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream api_up {
    server api:3100;
  }

  upstream atomo_up {
    server atomo:3001;
  }

  upstream identidade_up {
    server identidade:3001;
  }

  server {
    listen 80;

    location /socket.io/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://api_up;
    }

    location /auth {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://identidade_up;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://atomo_up;
    }
  }
}

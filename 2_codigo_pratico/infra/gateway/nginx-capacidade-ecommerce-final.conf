# Gateway NGINX — Strangler Fig (ecommerce / Capacidade de Negócio / final)
# Catálogo responde por /api/products e /uploads; Clientes por /api/auth,
# /api/users, /api/profile e /api/address; Comunicação por /api/emails; Vendas
# pelo restante (carrinho, pedido, cobrança e webhook). O monólito não existe
# mais. As rotas internas (/api/internal) são bloqueadas na borda.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream catalogo_up {
    server catalogo:3001;
  }

  upstream clientes_up {
    server clientes:3001;
  }

  upstream vendas_up {
    server vendas:3001;
  }

  upstream comunicacao_up {
    server comunicacao:3001;
  }

  server {
    listen 80;

    client_max_body_size 20m;

    location /api/internal {
      return 404;
    }

    location /api/auth {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://clientes_up;
    }

    location /api/users {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://clientes_up;
    }

    location /api/profile {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://clientes_up;
    }

    location /api/address {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://clientes_up;
    }

    location /api/products {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://catalogo_up;
    }

    location /uploads/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://catalogo_up;
    }

    location /api/emails {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://comunicacao_up;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://vendas_up;
    }
  }
}

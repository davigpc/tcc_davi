# Gateway NGINX — Strangler Fig (leilao / Capacidade de Negocio / s2)
# Leilao responde por /auctions; Lances por /auctions/:id/bids; o restante
# (auth, cartas, tipos de carta e Socket.IO) continua no monolito.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream api_up {
    server api:3100;
  }

  upstream leilao_up {
    server leilao:3001;
  }

  upstream lances_up {
    server lances:3001;
  }

  server {
    listen 80;

    # Lances tem precedencia sobre a rota de leilao
    location ~ ^/auctions/[0-9a-fA-F-]+/bids(/.*)?$ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://lances_up;
    }

    location /auctions {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://leilao_up;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://api_up;
    }
  }
}

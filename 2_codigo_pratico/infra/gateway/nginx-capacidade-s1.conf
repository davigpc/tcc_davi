# Gateway NGINX — Strangler Fig (ecommerce / Capacidade de Negócio / s1)
# A capacidade de Catálogo responde por /api/products e /uploads; o restante
# continua no monólito. O cliente segue batendo em http://localhost:3001.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream monolith_up {
    server monolith:3002;
  }

  upstream catalogo_up {
    server catalogo:3001;
  }

  server {
    listen 80;

    # Upload de imagem de produto passa pelo gateway (criação via POST)
    client_max_body_size 20m;

    # Capacidade extraída: Catálogo
    location /api/products {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://catalogo_up;
    }

    # Imagens de produto (o diretório é um volume compartilhado com o monólito)
    location /uploads/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://catalogo_up;
    }

    # Todo o restante continua no monólito
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://monolith_up;
    }
  }
}

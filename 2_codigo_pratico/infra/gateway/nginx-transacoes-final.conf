# Gateway NGINX - Strangler Fig (inventory-api / Transacoes / snapshot-final)
# Decomposicao concluida: o monolito esta desativado.
#   /api/auth, /api/users                              -> Identidade
#   /api/warehouses, /api/products, /api/movements     -> Estoque
#   /api/reports                                       -> Relatorios
#   /docs                                              -> Estoque (Swagger de referencia)
# Endpoints internos (/api/internal/*) NAO sao expostos publicamente.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream identity_up {
    server identity:3000;
  }
  upstream estoque_up {
    server estoque:3000;
  }
  upstream reports_up {
    server reports:3000;
  }

  server {
    listen 80;

    location /api/auth {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://identity_up;
    }

    location /api/users {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://identity_up;
    }

    location /api/warehouses {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://estoque_up;
    }

    location /api/products {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://estoque_up;
    }

    location /api/movements {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://estoque_up;
    }

    location /api/internal {
      return 404;
    }

    location /api/reports {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://reports_up;
    }

    location /docs {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://estoque_up;
    }

    location / {
      return 404;
    }
  }
}

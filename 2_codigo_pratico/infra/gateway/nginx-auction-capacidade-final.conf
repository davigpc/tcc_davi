# Gateway NGINX — Strangler Fig (leilao / Capacidade de Negocio / snapshot final)
# Identidade em /auth, Catalogo em /cards e /card-types, Leilao em /auctions,
# Lances em /auctions/:id/bids e Tempo Real em /socket.io.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream identidade_up {
    server identidade:3001;
  }

  upstream catalogo_up {
    server catalogo:3001;
  }

  upstream leilao_up {
    server leilao:3001;
  }

  upstream lances_up {
    server lances:3001;
  }

  upstream realtime_up {
    server tempo-real:3001;
  }

  server {
    listen 80;

    location /socket.io/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://realtime_up;
    }

    # Lances tem precedencia sobre a rota de leilao
    location ~ ^/auctions/[0-9a-fA-F-]+/bids(/.*)?$ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://lances_up;
    }

    location /auctions {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://leilao_up;
    }

    location /cards {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://catalogo_up;
    }

    location /card-types {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://catalogo_up;
    }

    location /auth {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://identidade_up;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://identidade_up;
    }
  }
}

# Gateway NGINX — Strangler Fig (ecommerce / Transações / s1)
# O Checkout responde por carrinho, pedido, pagamento, assinatura e webhook; o
# restante continua no monólito. O cliente segue batendo em http://localhost:3001.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  client_max_body_size 20m;

  upstream monolith_up {
    server monolith:3002;
  }

  upstream checkout_up {
    server checkout:3001;
  }

  server {
    listen 80;

    location /api/cart {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://checkout_up;
    }

    location /api/orders {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://checkout_up;
    }

    location /api/stripe {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://checkout_up;
    }

    location /api/subscriptions {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://checkout_up;
    }

    location /api/webhook {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://checkout_up;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://monolith_up;
    }
  }
}

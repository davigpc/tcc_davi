# Gateway NGINX - Strangler Fig (inventory-api / Transacoes / snapshot-1)
# O grupo atomico (warehouses/products/movements) sai primeiro para o servico
# de Estoque; identity e reports permanecem no monolito.
# Endpoints internos (/api/internal/*) NAO sao expostos publicamente.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream monolith_up {
    server monolith:3000;
  }
  upstream estoque_up {
    server estoque:3000;
  }

  server {
    listen 80;

    location /api/warehouses {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://estoque_up;
    }

    location /api/products {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://estoque_up;
    }

    location /api/movements {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://estoque_up;
    }

    location /api/internal {
      return 404;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://monolith_up;
    }
  }
}

# Gateway NGINX — Strangler Fig (inventory-api / Subdomínio (DDD) / snapshot-final)
# Monólito desativado. Roteia por prefixo:
#   /api/auth, /api/users                 -> Identidade (genérico)
#   /api/reports                          -> Relatórios (genérico)
#   /api/products, /api/warehouses        -> Suporte (suporte)
#   /api/movements                        -> Movimentações (núcleo)
#   /api/internal/*                       -> NÃO exposto (uso interno)

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  upstream identity_up  { server identity:3000; }
  upstream reports_up   { server reports:3000; }
  upstream support_up   { server support:3000; }
  upstream movements_up { server movements:3000; }

  server {
    listen 80;

    location /api/auth {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://identity_up;
    }

    location /api/users {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://identity_up;
    }

    location /api/reports {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://reports_up;
    }

    location /api/warehouses {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://support_up;
    }

    location /api/products {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://support_up;
    }

    location /api/movements {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://movements_up;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://movements_up;
    }
  }
}
